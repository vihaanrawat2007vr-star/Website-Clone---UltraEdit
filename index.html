<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .logo img{

        }
        nav{
            display: flex;
            justify-content: space-around;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .right ul{
            display: flex;
            gap: 44px;
        }
        .right ul li{
            list-style: none;
            display: flex;
            align-items: center;
            cursor: pointer;
        }
    </style>
</head>

    <header>
        <nav>
            <div class="logo">
                <img src="https://www.ultraedit.com/wp-content/uploads/2023/01/Dark-logo.png" alt="ultra edit logo">
            </div>
            <div class="right">
                <ul>
                    <li>Products <img src="down arrow.png" width="15" alt=""></li>
                    <li>Pricing <img src="down arrow.png" width="15" alt=""></li>
                    <li>Resources <img src="down arrow.png" width="15" alt=""></li>
                    <li>About us <img src="down arrow.png" width="15"></li>
                    <li><img src="language.png" alt="icon" width="25"></li>
                </ul>
            </div>
        </nav>
    </header>

</html>
